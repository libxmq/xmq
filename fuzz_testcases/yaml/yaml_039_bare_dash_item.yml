jobs:
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: wmbusmeters/wmbusmeters
        tags: type=ref,event=tag
