# Error messages for org.libxmq.ParseErrorCode, identical to the C version (xmq_internals.c).
XMQ_ERROR_CANNOT_READ_FILE=cannot read file
XMQ_ERROR_OOM=out of memory
XMQ_ERROR_NOT_XMQ=input file is not xmq
XMQ_ERROR_QUOTE_NOT_CLOSED=quote is not closed
XMQ_ERROR_ENTITY_NOT_CLOSED=entity is not closed
XMQ_ERROR_COMMENT_NOT_CLOSED=comment is not closed
XMQ_ERROR_COMMENT_CLOSED_WITH_TOO_MANY_SLASHES=comment closed with too many slashes
XMQ_ERROR_BODY_NOT_CLOSED=body is not closed
XMQ_ERROR_ATTRIBUTES_NOT_CLOSED=attributes are not closed
XMQ_ERROR_COMPOUND_NOT_CLOSED=compound is not closed
XMQ_ERROR_COMPOUND_MAY_NOT_CONTAIN=compound may only contain quotes and entities
XMQ_ERROR_QUOTE_CLOSED_WITH_TOO_MANY_QUOTES=quote closed with too many quotes
XMQ_ERROR_UNEXPECTED_CLOSING_BRACE=unexpected closing brace
XMQ_ERROR_EXPECTED_CONTENT_AFTER_EQUALS=expected content after equals
XMQ_ERROR_UNEXPECTED_TAB=invalid tab character found, remember that tab is not allowed as a field separator, to store tab as content it must be quoted
XMQ_ERROR_INVALID_CHAR=unexpected character
XMQ_ERROR_BAD_DOCTYPE=doctype could not be parsed
XMQ_ERROR_JSON_INVALID_ESCAPE=invalid json escape
XMQ_ERROR_JSON_INVALID_CHAR=unexpected json character
XMQ_ERROR_CANNOT_HANDLE_XML=cannot handle xml use libxmq-all for this!
XMQ_ERROR_CANNOT_HANDLE_HTML=cannot handle html use libxmq-all for this!
XMQ_ERROR_CANNOT_HANDLE_JSON=cannot handle json use libxmq-all for this!
XMQ_ERROR_EXPECTED_XMQ=expected xmq source
XMQ_ERROR_EXPECTED_HTMQ=expected htmlq source
XMQ_ERROR_EXPECTED_XML=expected xml source
XMQ_ERROR_EXPECTED_HTML=expected html source
XMQ_ERROR_EXPECTED_JSON=expected json source
XMQ_ERROR_PARSING_XML=error parsing xml
XMQ_ERROR_PARSING_HTML=error parsing html
XMQ_ERROR_VALUE_CANNOT_START_WITH=value cannot start with = /* or //
XMQ_ERROR_XML_FRAGMENT_NOT_CLOSED=embedded xml fragment is not closed
XMQ_ERROR_IXML_SYNTAX_ERROR=ixml syntax error
XMQ_WARNING_QUOTES_NEEDED=perhaps you need more quotes to quote this quote
