name: Build Wasm
on:
  push:
    branches:
      - master

jobs:
  job_build_wasm:
    runs-on: ubuntu-latest
    steps:
    - id: CHECKOUT_SOURCE
      uses: actions/checkout@v3
    - id: APT_UPDATE
      run: sudo apt update
    - id: INSTALL_ADDITIONAL_BUILD_DEPENDENCIES
      run: sudo apt install -y eatmydata emscripten
    - id: CONFIGURE
      run: CC=emcc LD=emcc ./configure --host=wasm32-unknown-emscripten STRIP=true
    - id: MAKE
      run: make release
